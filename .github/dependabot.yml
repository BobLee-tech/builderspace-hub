# Dependabot version updates. Security updates are switched on in the
# repository settings and arrive as soon as an advisory is published; these
# routine updates are batched to keep merges with upstream Kan manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
